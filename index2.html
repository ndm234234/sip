<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }

    /* 3D scene on the left, a single video card on the right. */
    #app { display: flex; height: 100%; }
    #scene { flex: 1 1 auto; min-width: 0; height: 100%; position: relative; overflow: hidden; background: #18202c; }
    #scene canvas { display: block; }

    /* Floating camera name labels (CSS2D overlay). */
    .label-layer { position: absolute; inset: 0; pointer-events: none; }
    .cam-label {
      font: 600 11px system-ui; color: #ffd8b0; white-space: nowrap;
      background: rgba(10,12,18,.7); border: 1px solid rgba(240,136,62,.4);
      padding: 2px 7px; border-radius: 999px; transform: translateY(-8px);
      pointer-events: none; backdrop-filter: blur(4px);
      transition: color .15s, border-color .15s, background .15s;
    }
    .cam-label.active { color: #fff; border-color: #f0883e; background: rgba(240,136,62,.22); }

    /* Hint chip shown while the floor apron is hovered (clicks go to the canvas). */
    .floor-badge {
      pointer-events: none;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      font: 600 11px system-ui; color: #fff;
      background: rgba(240,136,62,.32); border: 1px solid rgba(240,136,62,.75);
      padding: 5px 10px; border-radius: 999px; backdrop-filter: blur(4px);
      box-shadow: 0 6px 18px rgba(0,0,0,.45);
    }
    .floor-badge svg, #exit2d svg {
      width: 13px; height: 13px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    #feedNote {
      position: absolute; left: 12px; bottom: 44px; z-index: 5; display: none;
      color: #f0b46e; font: 500 12px system-ui;
      background: rgba(40,24,8,.6); border: 1px solid #5a3d17;
      padding: 6px 10px; border-radius: 8px; pointer-events: none; backdrop-filter: blur(6px);
    }
    #feedNote.on { display: block; }

    #hint {
      position: absolute; left: 12px; bottom: 12px; z-index: 5;
      color: #9fb0c3; font: 500 12px system-ui;
      background: rgba(8,11,18,.55); border: 1px solid #1e2733;
      padding: 6px 10px; border-radius: 8px; pointer-events: none; backdrop-filter: blur(6px);
    }

    /* Full-screen top-down plan of a single floor. */
    #scene.plan2d { position: fixed; inset: 0; z-index: 1500; }
    body.mode2d #side { position: fixed; top: 0; right: 0; height: 100%; z-index: 1600; }

    #plan2dBar {
      position: absolute; top: 12px; left: 12px; z-index: 6;
      display: none; align-items: center; gap: 10px;
    }
    body.mode2d #plan2dBar { display: flex; }
    #exit2d {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      font: 600 12px system-ui; color: #e6edf3; padding: 7px 12px;
      background: rgba(8,11,18,.7); border: 1px solid #2a3340; border-radius: 999px;
      backdrop-filter: blur(6px);
      transition: color .15s, border-color .15s, background .15s;
    }
    #exit2d:hover { color: #fff; border-color: #f0883e; background: rgba(240,136,62,.22); }
    #planTitle {
      font: 600 12px system-ui; color: #9fb0c3; letter-spacing: .02em;
      padding: 7px 12px; background: rgba(8,11,18,.55);
      border: 1px solid #1e2733; border-radius: 999px;
      pointer-events: none; backdrop-filter: blur(6px);
    }

    /* Floor switcher */
    #floors {
      position: absolute; top: 12px; right: 12px; z-index: 6;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      max-height: calc(100% - 24px);
      background: rgba(8,11,18,.6); border: 1px solid #1e2733;
      border-radius: 12px; padding: 8px; backdrop-filter: blur(6px);
    }
    .fbtn {
      width: 36px; height: 28px; cursor: pointer; color: #cdd7e3;
      background: rgba(255,255,255,.04); border: 1px solid #2a3340; border-radius: 8px;
      font-size: 13px; line-height: 1;
    }
    .fbtn:hover { color: #fff; border-color: #f0883e; background: rgba(240,136,62,.15); }
    #floorList {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 0 2px 13px;
      scrollbar-width: thin; scrollbar-color: #3a4658 transparent;
      scrollbar-gutter: stable;
    }
    #floorList::-webkit-scrollbar { width: 6px; }
    #floorList::-webkit-scrollbar-thumb { background: #3a4658; border-radius: 3px; }
    #floorList::-webkit-scrollbar-track { background: transparent; }
    .fsep { flex: 0 0 auto; width: 28px; height: 1px; background: #2a3340; margin: 2px 0; }
    .fbtn { flex: 0 0 auto; }
    .fbtn.fall { font-size: 15px; }
    .fbtn.fall.active { color: #0b0d12; background: #f0883e; border-color: #f0883e; }
    .fpip {
      flex: 0 0 auto;
      width: 36px; height: 30px; display: grid; place-items: center; cursor: pointer;
      font: 600 12px system-ui; color: #9fb0c3;
      background: rgba(255,255,255,.03); border: 1px solid #2a3340; border-radius: 8px;
      transition: color .15s, border-color .15s, background .15s;
    }
    .fpip:hover { color: #fff; border-color: #3f5a8a; }
    .fpip.active { color: #0b0d12; background: #f0883e; border-color: #f0883e; }

    /* Right-side holder for one card. Collapses to zero width when empty. */
    #side {
      flex: 0 0 auto; height: 100%;
      background: #0b0d12; overflow: hidden;
    }
    #side:empty { width: 0; padding: 0; }
    #side:not(:empty) { width: min(33vw, 440px); padding: 8px; }

    /* The video card slides in from the right; height follows the 16:9 video. */
    .map-card {
      width: 100%; height: auto;
      background: linear-gradient(180deg, #11151c, #0d0f14);
      border: 1px solid #232a36; border-radius: 10px;
      box-shadow: -10px 0 32px rgba(0,0,0,.5);
      overflow: hidden; display: flex; flex-direction: column;
      transform: translateX(110%); opacity: 0;
      transition: transform .32s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
    }
    .map-card.open { transform: translateX(0); opacity: 1; }
    .map-card.no-anim { transition: none; }

    /* Expanded over the whole screen (no animation). */
    .map-card.fullscreen {
      position: fixed; inset: 0; width: 100%; height: 100%;
      transform: none; border: 0; border-radius: 0; z-index: 2000; opacity: 1;
      transition: none;
    }
    .map-card.fullscreen iframe {
      margin: 0; width: 100%; border-radius: 0;
      aspect-ratio: auto; height: 100%; flex: 1 1 auto;
    }

    .card-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; color: #e6edf3;
      background: linear-gradient(90deg, rgba(240,136,62,.18), rgba(240,136,62,0));
      border-bottom: 1px solid #232a36;
    }
    .card-bar .live {
      display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
      font: 600 10px/1 system-ui; letter-spacing: .12em; text-transform: uppercase;
      color: #ffb37a; padding: 4px 8px; border: 1px solid rgba(240,136,62,.4);
      border-radius: 999px; background: rgba(240,136,62,.12);
    }
    .card-bar .live::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%;
      background: #ff5d5d; box-shadow: 0 0 0 0 rgba(255,93,93,.6);
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(255,93,93,.55); }
      70%  { box-shadow: 0 0 0 7px rgba(255,93,93,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,93,93,0); }
    }
    .card-bar .title {
      font-size: 13px; font-weight: 600; letter-spacing: .02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-bar .spacer { flex: 1; }
    .card-bar .icon-btn {
      cursor: pointer; color: #aeb8c6; background: rgba(255,255,255,.04);
      border: 1px solid #2a3340; border-radius: 6px;
      width: 26px; height: 26px; display: grid; place-items: center; padding: 0;
      transition: color .15s, border-color .15s, background .15s;
    }
    .card-bar .icon-btn:hover { color: #fff; border-color: #f0883e; background: rgba(240,136,62,.15); }
    .card-bar .icon-btn svg {
      width: 15px; height: 15px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .map-card iframe {
      flex: 0 0 auto; display: block;
      margin: 8px; width: auto;
      aspect-ratio: 16 / 9; height: auto;
      border: 0; background: #000;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="scene">
      <div id="hint">ЛКМ — вращать · колесо — зум · клик по камере — видео · ▲/▼ — этаж</div>
      <div id="feedNote"></div>
      <div id="plan2dBar">
        <button id="exit2d" title="Вернуться в 3D">
          <svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>
          3D
        </button>

  <!-- ===================== Video card (unchanged behavior) ===================== -->
  <script type="text/javascript">
    const VIDEO_URL = 'http://nas/embedded.html?login=root&password=vRCdJWppWUJpUqJ5C4pB';

    const sideHost = document.getElementById('side');
    let current = null;       // { cam, el, iframe } or null
    window.selectedCam = null; // read by the 3D scene to highlight the active camera

    function buildCommand(origin) {
      return {
        type: 'init',
        mode: 'live',
        origin: origin,
        archive: {
          time: new Date(),
          storage: 'hosts/NAS/MultimediaStorage.AliceBlue/MultimediaStorage',
        },
        options: { archivePane: false },
      };
    }

    function sendInit(c) {
      if (c && c.iframe.contentWindow) {
        c.iframe.contentWindow.postMessage(buildCommand(c.cam.origin), '*');
      }
    }

    // The embedded player posts {type:'embeddedLoad'} once ready; init it then.
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'embeddedLoad') return;
      if (current && current.iframe.contentWindow === e.source) sendInit(current);
    });

    function closeCard() {
      if (!current) return;
      const c = current;
      current = null;
      window.selectedCam = null;
      c.el.classList.remove('open');
      setTimeout(function () { c.el.remove(); }, 320);
    }

    // openCard is called by the 3D scene when a camera is clicked.
    window.openCard = function (cam) {
      window.selectedCam = cam;
      if (window.focusCamera) window.focusCamera(cam); // 3D fly-to

      if (current && current.cam === cam) { sendInit(current); return; }

      const animate = !current;
      if (current) { current.el.remove(); current = null; }

      const fsIcon = '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
      const closeIcon = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

      const el = document.createElement('div');
      el.className = 'map-card';
      el.innerHTML =
        '<div class="card-bar">' +
          '<span class="live">live</span>' +
          '<span class="title"></span>' +
          '<span class="spacer"></span>' +
          '<button class="icon-btn fs" title="Развернуть">' + fsIcon + '</button>' +
          '<button class="icon-btn close" title="Закрыть">' + closeIcon + '</button>' +
        '</div>';
      el.querySelector('.title').textContent = '\u042D\u0442\u0430\u0436 ' + (cam.floor + 1) + ' \u00B7 ' + (cam.room || cam.name);

      const iframe = document.createElement('iframe');
      iframe.setAttribute('allowfullscreen', '');
      el.appendChild(iframe);
      sideHost.appendChild(el);

      const c = { cam: cam, el: el, iframe: iframe };
      current = c;
      el.querySelector('.close').addEventListener('click', function (ev) {
        ev.stopPropagation();
        closeCard();
      });
      el.querySelector('.fs').addEventListener('click', function (ev) {
        ev.stopPropagation();
        el.classList.toggle('fullscreen');
      });

      if (animate) {
        requestAnimationFrame(function () { el.classList.add('open'); });
      } else {
        el.classList.add('no-anim', 'open');
        requestAnimationFrame(function () { el.classList.remove('no-anim'); });
      }
      iframe.src = VIDEO_URL;
    };
  </script>

  <!-- ===================== 3D premises scene (Three.js) ===================== -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const ORIGIN_A = 'hosts/NAS/DeviceIpint.4/SourceEndpoint.video:0:0';
    const ORIGIN_B = 'hosts/NAS/DeviceIpint.1/SourceEndpoint.video:0:0';

    const FLOORS = 50;
    const FLOOR_SPACING = 5; // vertical distance between floor slabs

    // Deterministic PRNG so the random layout stays stable across reloads.
    let _seed = 20260630;
    function rnd() { _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; }
    function rng(min, max) { return min + (max - min) * rnd(); }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    const ROOM_NAMES = ['\u041B\u043E\u0431\u0431\u0438', '\u0412\u0445\u043E\u0434', '\u041A\u043E\u0440\u0438\u0434\u043E\u0440', '\u041A\u0430\u0431\u0438\u043D\u0435\u0442', '\u0421\u043A\u043B\u0430\u0434', '\u0425\u043E\u043B\u043B', '\u041F\u0435\u0440\u0435\u0433\u043E\u0432\u043E\u0440\u043D\u0430\u044F', '\u0421\u0435\u0440\u0432\u0435\u0440\u043D\u0430\u044F', '\u0410\u0440\u0445\u0438\u0432', '\u041B\u0435\u0441\u0442\u043D\u0438\u0446\u0430'];

    // Each floor gets its own unique set of randomly placed cameras.
    const CAMERAS = [];
    for (let f = 0; f < FLOORS; f++) {
      const count = 3 + Math.floor(rnd() * 4); // 3..6 cameras per floor
      const names = ROOM_NAMES.slice();
      for (let i = 0; i < count; i++) {
        const px = rng(-16, 16);
        const pz = rng(-10, 10);
        const py = rng(2.4, 2.9);
        const lx = clamp(px + rng(-7, 7), -17, 17);
        const lz = clamp(pz + rng(-7, 7), -11, 11);
        const nm = names.length ? names.splice(Math.floor(rnd() * names.length), 1)[0] : ('\u041A\u0430\u043C\u0435\u0440\u0430 ' + (i + 1));
        CAMERAS.push({
          name: (f + 1) + ' \u00B7 ' + nm,
          room: nm,
          floor: f,
          pos: [px, py, pz],
          look: [lx, 0, lz],
          origin: (Math.floor(rnd() * 2) === 0) ? ORIGIN_A : ORIGIN_B,
        });
      }
    }

    const container = document.getElementById('scene');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x18202c);
    scene.fog = new THREE.FogExp2(0x18202c, 0.0015);

    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 2500);
    camera.position.set(30, 26, 34);

    // Top-down camera used by the full-screen 2D floor plan.
    const planCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1200);
    planCam.up.set(0, 0, -1);
    let activeCam = camera; // camera currently used for rendering and picking

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.domElement.className = 'label-layer';
    container.appendChild(labelRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);
    controls.minDistance = 8;
    controls.maxDistance = 700;
    controls.maxPolarAngle = Math.PI * 0.49; // don't go under the floor
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    // Pan/zoom only, for the 2D plan view.
    const planControls = new OrbitControls(planCam, renderer.domElement);
    planControls.enableRotate = false;
    planControls.enableDamping = true;
    planControls.dampingFactor = 0.12;
    planControls.minZoom = 0.6;
    planControls.maxZoom = 8;
    planControls.enabled = false;

    // ---- Lighting ----
    scene.add(new THREE.HemisphereLight(0xc6d6ff, 0x33405a, 1.0));
    scene.add(new THREE.AmbientLight(0x6b788f, 0.65));
    const sun = new THREE.DirectionalLight(0xfff2e2, 1.5);
    sun.position.set(30, 50, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1; sun.shadow.camera.far = 160;
    sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
    sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
    scene.add(sun);
    const fill = new THREE.PointLight(0x3a6cff, 0.6, 120);
    fill.position.set(-25, 16, -20);
    scene.add(fill);

    // ---- Per-floor building (slab, grid, glassy walls) ----
    const WALL_H = 2.8, WALL_T = 0.25;
    const WALLS = [
      [-18, -12,  18, -12],
      [ 18, -12,  18,  12],
      [ 18,  12, -18,  12],
      [-18,  12, -18, -12],
      [-6, -12, -6,  2],
      [ 6,   2,  6, 12],
      [-18,  0, -6,  0],
    ];

    function addWall(parent, wallMat, edgeMat, x1, z1, x2, z2) {
      const dx = x2 - x1, dz = z2 - z1;
      const len = Math.hypot(dx, dz);
      const geo = new THREE.BoxGeometry(len, WALL_H, WALL_T);
      const mesh = new THREE.Mesh(geo, wallMat);
      mesh.position.set((x1 + x2) / 2, WALL_H / 2, (z1 + z2) / 2);
      mesh.rotation.y = -Math.atan2(dz, dx);
      mesh.castShadow = true; mesh.receiveShadow = true;
      parent.add(mesh);
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
      edges.position.copy(mesh.position); edges.rotation.copy(mesh.rotation);
      parent.add(edges);
    }

    const floors = [];
    let activeFloor = 0;
    let overview = false; // "whole building" mode: all floors stacked & visible
    let mode2d = false;   // full-screen top-down plan of the active floor

    // Procedural blueprint-style plan, unique per floor (rooms via BSP split).
    // Its own seeded PRNG keeps a floor's layout reproducible, so the same plan
    // can be re-drawn at a larger scale for the full-screen 2D view.
    const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    function makePlanTexture(seed, scale) {
      const S = scale || 1;
      let s = ((seed + 1) * 2654435761) >>> 0;
      function nx() { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }
      function nxr(min, max) { return min + (max - min) * nx(); }
      nx(); nx(); nx(); // shake off correlated low seeds

      const W = Math.round(512 * S), H = Math.round(W * FOOT_Z / FOOT_X);
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      // The canvas now covers exactly the walled footprint.
      const inset = 3 * S;
      const fx = inset, fw = W - inset * 2;
      const fy = inset, fh = H - inset * 2;

      // Faint background grid across the whole slab.
      ctx.strokeStyle = 'rgba(120,160,210,0.07)'; ctx.lineWidth = S;
      for (let x = 0; x <= W; x += 26 * S) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y <= H; y += 26 * S) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

      // Split the footprint into rooms.
      const MIN = 64 * S;
      const rooms = [];
      (function split(r, depth) {
        if (depth <= 0 || (r.w < MIN * 2 && r.h < MIN * 2) || nx() < 0.12) { rooms.push(r); return; }
        if (r.w >= r.h) {
          if (r.w < MIN * 2) { rooms.push(r); return; }
          const cut = nxr(MIN, r.w - MIN);
          split({ x: r.x, y: r.y, w: cut, h: r.h }, depth - 1);
          split({ x: r.x + cut, y: r.y, w: r.w - cut, h: r.h }, depth - 1);
        } else {
          if (r.h < MIN * 2) { rooms.push(r); return; }
          const cut = nxr(MIN, r.h - MIN);
          split({ x: r.x, y: r.y, w: r.w, h: cut }, depth - 1);
          split({ x: r.x, y: r.y + cut, w: r.w, h: r.h - cut }, depth - 1);
        }
      })({ x: fx, y: fy, w: fw, h: fh }, 4);

      // Rooms: light tint + walls, some hatched (e.g. service areas).
      rooms.forEach(function (r) {
        ctx.fillStyle = nx() < 0.5 ? 'rgba(90,140,200,0.05)' : 'rgba(90,140,200,0.10)';
        ctx.fillRect(r.x, r.y, r.w, r.h);
        if (nx() < 0.25) {
          ctx.save();
          ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
          ctx.strokeStyle = 'rgba(120,170,225,0.16)'; ctx.lineWidth = S;
          for (let d = -r.h; d < r.w; d += 12 * S) { ctx.beginPath(); ctx.moveTo(r.x + d, r.y); ctx.lineTo(r.x + d + r.h, r.y + r.h); ctx.stroke(); }
          ctx.restore();
        }
        ctx.strokeStyle = 'rgba(120,170,225,0.55)'; ctx.lineWidth = 2 * S;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
      });

      // Outer building boundary, drawn bold on top.
      ctx.strokeStyle = 'rgba(150,200,255,0.85)'; ctx.lineWidth = 4 * S;
      ctx.strokeRect(fx, fy, fw, fh);

      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;
      return tex;
    }

    // Floor plates are the scene's handles: the inner slab selects its floor,
    // the apron around it opens the 2D plan.
    const floorPlates = [];
    const SLAB_COLOR = 0x232c3a, SLAB_HOVER = 0x33455f;
    const FOOT_X = 18, FOOT_Z = 12;         // outer wall footprint
    const SLAB_X = 22, SLAB_Z = 16;         // plate incl. the apron around it

    // Ring of floor reaching from the outer walls to the edge of the plate.
    const APRON_GEO = (function () {
      const outline = new THREE.Shape();
      outline.moveTo(-SLAB_X, -SLAB_Z);
      outline.lineTo(SLAB_X, -SLAB_Z);
      outline.lineTo(SLAB_X, SLAB_Z);
      outline.lineTo(-SLAB_X, SLAB_Z);
      outline.lineTo(-SLAB_X, -SLAB_Z);
      const hole = new THREE.Path();
      hole.moveTo(-FOOT_X, -FOOT_Z);
      hole.lineTo(-FOOT_X, FOOT_Z);
      hole.lineTo(FOOT_X, FOOT_Z);
      hole.lineTo(FOOT_X, -FOOT_Z);
      hole.lineTo(-FOOT_X, -FOOT_Z);
      outline.holes.push(hole);
      return new THREE.ShapeGeometry(outline);
    })();

    function buildFloor(level) {
      const g = new THREE.Group();
      g.position.y = level * FLOOR_SPACING;

      const slabMat = new THREE.MeshStandardMaterial({ color: SLAB_COLOR, metalness: 0.2, roughness: 0.9 });
      const slab = new THREE.Mesh(new THREE.PlaneGeometry(FOOT_X * 2, FOOT_Z * 2), slabMat);
      slab.rotation.x = -Math.PI / 2; slab.receiveShadow = true; g.add(slab);

      // The apron reaching past the walls is what opens the 2D plan, so only the
      // floor in focus lays one out.
      const apronMat = new THREE.MeshStandardMaterial({ color: SLAB_COLOR, metalness: 0.2, roughness: 0.9 });
      const apron = new THREE.Mesh(APRON_GEO, apronMat);
      apron.rotation.x = -Math.PI / 2; apron.receiveShadow = true; g.add(apron);

      // Floor-plan overlay sitting just above the slab.
      const baseTex = makePlanTexture(level, 1);
      const planMat = new THREE.MeshBasicMaterial({ map: baseTex, transparent: true, opacity: 0.9, depthWrite: false });
      const plan = new THREE.Mesh(new THREE.PlaneGeometry(FOOT_X * 2, FOOT_Z * 2), planMat);
      plan.rotation.x = -Math.PI / 2; plan.position.y = 0.04; g.add(plan);

      slab.userData.floorLevel = level; slab.userData.plate = 'slab';
      apron.userData.floorLevel = level; apron.userData.plate = 'apron';
      floorPlates.push(slab, apron);

      const wallMat = new THREE.MeshStandardMaterial({ color: 0x4a566c, metalness: 0.2, roughness: 0.8, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
      const edgeMat = new THREE.LineBasicMaterial({ color: 0x3f5a8a, transparent: true, opacity: 1 });
      WALLS.forEach(function (s) { addWall(g, wallMat, edgeMat, s[0], s[1], s[2], s[3]); });

      scene.add(g);
      floors.push({
        level: level, group: g, baseY: level * FLOOR_SPACING, targetY: level * FLOOR_SPACING,
        slabMat: slabMat, wallMat: wallMat, edgeMat: edgeMat, planMat: planMat,
        apron: apron, apronMat: apronMat,
        baseTex: baseTex, hiTex: null,
      });
    }
    for (let f = 0; f < FLOORS; f++) buildFloor(f);

    // Exploded view: open a clear gap around the active floor. Everything above it
    // shifts up by one extra floor height, everything below shifts down, so the two
    // neighbours sit at 2x the normal distance while distant floors keep normal spacing.
    const FLOOR_GAP = FLOOR_SPACING * 3; // extra gap -> adjacent floors at 4x spacing
    function applyFloorSpread() {
      floors.forEach(function (fl) {
        if (overview || mode2d) { fl.targetY = fl.baseY; return; } // collapse to a solid stack
        const d = fl.level - activeFloor;
        fl.targetY = fl.baseY + Math.sign(d) * FLOOR_GAP;
      });
    }

    // ---- What the cameras pick up ----------------------------------------
    // Rather than abstract coverage volumes, each camera shows the thing it
    // actually catches: a person walking across its line of sight, standing
    // upright on the floor. The sprites are cut-outs on a transparent canvas,
    // so nothing but the person is drawn.
    const PERSON_H = 1.78;                 // metres, floor to top of head
    const SPRITE_W = 168, SPRITE_H = 300;  // sprite canvas, px
    const KEY_TOL = 0.26;                  // how close to the backdrop counts as background
    const FEED_W = 4.4, FEED_H = 2.6;      // metres the clip may occupy, under WALL_H

    // The clip is served with CORS headers so WebGL can sample it even when this
    // page is opened straight from disk; a file:// copy cannot be textured.
    const PERSON_VIDEO = 'https://ndm234234.github.io/sip/1.webm';
    const PERSON_VIDEO_LOCAL = 'walk.mp4';

    function makePersonSprite(phaseOffset) {
      const cv = document.createElement('canvas');
      cv.width = SPRITE_W; cv.height = SPRITE_H;
      const ctx = cv.getContext('2d');
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAniso;

      const H = SPRITE_H - 16;          // body height in px
      const base = SPRITE_H - 8;        // floor line
      const cx = SPRITE_W / 2;
      const headR = H * 0.062;

      // The whole figure is drawn twice: once fattened and dark as an outline,
      // once in light grey, so it stays readable over any floor colour.
      function figure(phase, extra, color) {
        const bob = Math.abs(Math.cos(phase)) * H * 0.012;
        const hipY = base - H * 0.50 - bob;
        const shY = base - H * 0.81 - bob;
        const headY = base - H * 0.935 - bob;

        ctx.strokeStyle = color; ctx.fillStyle = color;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';

        ctx.lineWidth = H * 0.075 + extra;
        [Math.sin(phase), Math.sin(phase + Math.PI)].forEach(function (s) {
          ctx.beginPath();
          ctx.moveTo(cx, hipY);
          ctx.lineTo(cx + s * H * 0.085, hipY + H * 0.25 - Math.max(0, s) * H * 0.02);
          ctx.lineTo(cx + s * H * 0.17, base - Math.max(0, s) * H * 0.05);
          ctx.stroke();
        });

        ctx.lineWidth = H * 0.05 + extra;
        [Math.sin(phase + Math.PI), Math.sin(phase)].forEach(function (s) {
          ctx.beginPath();
          ctx.moveTo(cx, shY);
          ctx.lineTo(cx + s * H * 0.07, shY + H * 0.17);
          ctx.lineTo(cx + s * H * 0.14, shY + H * 0.31);
          ctx.stroke();
        });

        ctx.lineWidth = H * 0.15 + extra;
        ctx.beginPath();
        ctx.moveTo(cx, hipY + H * 0.02);
        ctx.lineTo(cx + H * 0.012, shY);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx + H * 0.016, headY, headR + extra * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }

      let acc = 1;
      return {
        texture: tex,
        step: function (t, dt) {
          acc += dt;
          if (acc < 1 / 24) return; // camera-ish frame rate
          acc = 0;
          const phase = t * 3.4 + phaseOffset;
          ctx.clearRect(0, 0, SPRITE_W, SPRITE_H);
          figure(phase, 7, 'rgba(9,13,19,0.55)');
          figure(phase, 0, '#e9f0f8');
          tex.needsUpdate = true;
        },
      };
    }

    // A few phase-shifted copies so people in neighbouring rooms don't march in
    // lockstep; markers pick one in turn.
    const sprites = [makePersonSprite(0), makePersonSprite(2.1), makePersonSprite(4.2)];

    // Faint pool of light under each person: on a floor this dark a cast
    // shadow would be invisible, so the contact point is lit instead.
    function makeBlobTexture() {
      const S = 128;
      const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
      const ctx = cv.getContext('2d');
      const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
      g.addColorStop(0, 'rgba(150,190,255,0.34)');
      g.addColorStop(0.45, 'rgba(120,165,235,0.13)');
      g.addColorStop(1, 'rgba(110,155,225,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const blobTex = makeBlobTexture();

    // One shared quad; each person is placed by scaling and offsetting it so the
    // figure inside the frame ends up PERSON_H tall with its feet on the floor.
    const PERSON_GEO = new THREE.PlaneGeometry(1, 1);
    const fit = { w: 1.06, h: 1.89, cx: 0, cy: 0.89 };   // measured for the drawn sprite
    const fitTarget = Object.assign({}, fit);

    const PERSON_VERT = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;
    // Sprites carry their own alpha. Video frames are opaque: a clip shot
    // against a flat backdrop gets that backdrop keyed out, leaving the person
    // alone, while ordinary footage simply plays as a soft-edged panel. The
    // backdrop colour is read from the frame's own corners, which keeps the
    // comparison in whatever colour space the sampler hands back.
    const PERSON_FRAG = `
      uniform sampler2D uMap;
      uniform float uTol;
      uniform float uKeyOn;
      uniform float uFeather;
      varying vec2 vUv;
      vec3 enc(vec3 c) { return sqrt(max(c, 0.0)); }
      void main() {
        vec4 c = texture2D(uMap, vUv);
        float a = c.a;
        if (uKeyOn > 0.5) {
          vec3 bg = ( texture2D(uMap, vec2(0.015, 0.015)).rgb
                    + texture2D(uMap, vec2(0.985, 0.015)).rgb
                    + texture2D(uMap, vec2(0.015, 0.985)).rgb
                    + texture2D(uMap, vec2(0.985, 0.985)).rgb ) * 0.25;
          a *= smoothstep(uTol, uTol + 0.13, distance(enc(c.rgb), enc(bg)));
        }
        vec2 e = min(vUv, 1.0 - vUv);
        a *= smoothstep(0.0, uFeather, min(e.x, e.y)); // never show a hard frame edge
        if (a < 0.02) discard;
        // Unlit, but tone mapped with everything else so the clip reads as part
        // of the scene rather than a lit-up panel.
        gl_FragColor = vec4(c.rgb, a);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `;

    const personMats = sprites.map(function (s) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uMap: { value: s.texture },
          uTol: { value: KEY_TOL },
          uKeyOn: { value: 0 },
          uFeather: { value: 0.012 },
        },
        vertexShader: PERSON_VERT,
        fragmentShader: PERSON_FRAG,
        transparent: true, depthWrite: false, side: THREE.DoubleSide,
      });
    });

    // The clip takes over from the drawn figure as soon as it can play. Loading
    // it from a CORS-enabled URL keeps it usable as a texture from file:// too;
    // a copy sitting next to this page is the offline fallback.
    const person = { live: false, mirror: true, probeAcc: 0, kick: function () {} };

    function showFeedNote() {
      const el = document.getElementById('feedNote');
      el.textContent = '\u0420\u043E\u043B\u0438\u043A \u0441 \u0434\u0438\u0441\u043A\u0430 WebGL \u043D\u0435 \u0431\u0435\u0440\u0451\u0442 \u2014 \u043E\u0442\u043A\u0440\u043E\u0439\u0442\u0435 \u0441\u0442\u0440\u0430\u043D\u0438\u0446\u0443 \u0447\u0435\u0440\u0435\u0437 \u043B\u043E\u043A\u0430\u043B\u044C\u043D\u044B\u0439 \u0441\u0435\u0440\u0432\u0435\u0440';
      el.classList.add('on');
    }

    (function loadPersonVideo() {
      const v = document.createElement('video');
      v.crossOrigin = 'anonymous'; // must be set before src to matter
      v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
      v.preload = 'auto'; v.src = PERSON_VIDEO;
      // Kept in the document (out of sight) so the browser keeps decoding it.
      v.style.cssText = 'position:fixed;left:-4px;top:-4px;width:2px;height:2px;opacity:0.01;pointer-events:none';
      document.body.appendChild(v);
      const tex = new THREE.VideoTexture(v);
      tex.colorSpace = THREE.SRGBColorSpace;

      const probe = document.createElement('canvas');
      const pctx = probe.getContext('2d', { willReadFrequently: true });
      let readable = true;

      v.addEventListener('error', function () {
        if (v.src.indexOf(PERSON_VIDEO_LOCAL) < 0) { v.src = PERSON_VIDEO_LOCAL; v.load(); }
      });

      // Fit the whole frame on the floor, upright, bottom edge on the slab.
      function feedFit(vw, vh) {
        person.mirror = false;
        const h = Math.min(FEED_H, FEED_W * vh / vw);
        fitTarget.h = h;
        fitTarget.w = h * (vw / vh);
        fitTarget.cy = h / 2;
        fitTarget.cx = 0;
      }

      // Find the backdrop colour from the frame corners, then the bounding box
      // of everything that isn't the backdrop: that box is the person.
      person.measure = function () {
        const vw = v.videoWidth, vh = v.videoHeight;
        if (!vw || !vh || v.readyState < 2) return;
        if (!readable) { feedFit(vw, vh); return; }
        const W = 72, H = Math.max(8, Math.round(W * vh / vw));
        probe.width = W; probe.height = H;
        pctx.drawImage(v, 0, 0, W, H);
        let data;
        try { data = pctx.getImageData(0, 0, W, H).data; }
        catch (err) { readable = false; feedFit(vw, vh); return; } // clip we may not inspect
        let r = 0, g = 0, b = 0, n = 0;
        for (let y = 0; y < 3; y++) {
          for (let x = 0; x < 3; x++) {
            const corners = [[x, y], [W - 1 - x, y], [x, H - 1 - y], [W - 1 - x, H - 1 - y]];
            for (let c = 0; c < 4; c++) {
              const i = (corners[c][1] * W + corners[c][0]) * 4;
              r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
            }
          }
        }
        r /= n * 255; g /= n * 255; b /= n * 255;

        let x0 = W, y0 = H, x1 = -1, y1 = -1;
        const tol2 = KEY_TOL * KEY_TOL;
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4;
            const dr = data[i] / 255 - r, dg = data[i + 1] / 255 - g, db = data[i + 2] / 255 - b;
            if (dr * dr + dg * dg + db * db > tol2) {
              if (x < x0) x0 = x;
              if (x > x1) x1 = x;
              if (y < y0) y0 = y;
              if (y > y1) y1 = y;
            }
          }
        }
        if (x1 < x0 || y1 < y0) return;

        // A box filling the frame means busy footage: play it as it is rather
        // than cutting a person-shaped hole out of the scenery.
        const bw = (x1 - x0 + 1) / W, bh = (y1 - y0 + 1) / H;
        const keyable = bh < 0.9 && bw < 0.9;
        personMats.forEach(function (m) {
          m.uniforms.uKeyOn.value = keyable ? 1 : 0;
          m.uniforms.uFeather.value = keyable ? 0.012 : 0.045;
        });
        person.mirror = keyable; // never flip real footage
        if (!keyable) { feedFit(vw, vh); return; }

        const h = PERSON_H / bh;
        fitTarget.h = h;
        fitTarget.w = h * (vw / vh);
        fitTarget.cy = h * ((y1 + 1) / H - 0.5);
        fitTarget.cx = -fitTarget.w * ((x0 + x1 + 1) / (2 * W) - 0.5);
      };

      // Some browsers hold muted autoplay until the page is touched.
      person.kick = function () { if (v.paused) v.play().catch(function () {}); };

      v.addEventListener('loadeddata', function () {
        person.measure();
        // A frame we may not read is also a frame WebGL refuses to upload, so
        // keep the drawn figures instead of hanging black panels in the rooms.
        if (!readable) { showFeedNote(); return; }
        person.live = true;
        personMats.forEach(function (m) { m.uniforms.uMap.value = tex; });
        Object.assign(fit, fitTarget); // no slide-in on the first frame
      });
      v.play().catch(function () {});
    })();

    // ---- Cameras (one set per floor) ----
    const camObjs = [];
    const pickables = [];
    const FWD = new THREE.Vector3(0, 0, 1);

    function makeCamera(cam) {
      const local = new THREE.Vector3().fromArray(cam.pos);
      const lookLocal = new THREE.Vector3().fromArray(cam.look);
      const dir = lookLocal.clone().sub(local).normalize();

      const group = new THREE.Group();
      group.position.copy(local);
      group.quaternion.setFromUnitVectors(FWD, dir);
      group.userData.cam = cam;

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.42, 0.8),
        new THREE.MeshStandardMaterial({ color: 0x171a21, metalness: 0.85, roughness: 0.35 })
      );
      body.position.z = -0.25; body.castShadow = true; group.add(body);

      const lens = new THREE.Mesh(
        new THREE.SphereGeometry(0.17, 24, 24),
        new THREE.MeshStandardMaterial({ color: 0xf0883e, emissive: 0xf0883e, emissiveIntensity: 1.2, roughness: 0.4 })
      );
      lens.position.z = 0.12; group.add(lens);

      // Someone walking across what this camera watches: a path straight
      // through the aim point, at right angles to the line of sight.
      const flat = new THREE.Vector3(dir.x, 0, dir.z);
      if (flat.lengthSq() < 1e-6) flat.set(0, 0, 1);
      flat.normalize();
      const side = new THREE.Vector3(-flat.z, 0, flat.x);
      const reach = 2.0 + rnd() * 1.8;
      const from = lookLocal.clone().addScaledVector(side, -reach);
      const to = lookLocal.clone().addScaledVector(side, reach);
      [from, to].forEach(function (v) {
        v.x = clamp(v.x, -17, 17);
        v.z = clamp(v.z, -11, 11);
        v.y = 0;
      });

      // A holder sits on the walking path; the quad inside it holds the image.
      const fl = floors[cam.floor];
      fl.crowd = (fl.crowd || 0) + 1;
      const walker = new THREE.Object3D();
      const quad = new THREE.Mesh(PERSON_GEO, personMats[fl.crowd % personMats.length]);
      quad.renderOrder = 5;
      walker.add(quad);
      fl.group.add(walker);

      const shadow = new THREE.Mesh(
        new THREE.PlaneGeometry(1.6, 1.6),
        new THREE.MeshBasicMaterial({
          map: blobTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        })
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = 0.05 + fl.crowd * 0.004; // above the plan, below the walls
      shadow.renderOrder = 4;
      fl.group.add(shadow);

      const div = document.createElement('div');
      div.className = 'cam-label';
      div.textContent = cam.name;
      const label = new CSS2DObject(div);
      label.position.set(0, 0.7, 0);
      group.add(label);

      floors[cam.floor].group.add(group);
      camObjs.push({
        cam: cam, group: group, lens: lens, label: div, labelObj: label,
        walker: walker, quad: quad, shadow: shadow,
        from: from, to: to, span: from.distanceTo(to),
        speed: 0.7 + rnd() * 0.4, phase: rnd() * 20,
      });
      pickables.push(group);

      cam._pos = local.clone().add(new THREE.Vector3(0, cam.floor * FLOOR_SPACING, 0));
      cam._dir = dir;
    }
    CAMERAS.forEach(makeCamera);

    // ---- Floor navigation (up/down between the 5 floors) ----
    const VIEW_OFFSET = new THREE.Vector3(30, 16, 34);
    function floorCenterY(level) { return level * FLOOR_SPACING + 1.4; }

    function applyFloorVisuals() {
      floors.forEach(function (fl) {
        const on = overview || fl.level === activeFloor;
        fl.group.visible = !mode2d || fl.level === activeFloor; // plan view shows one floor only
        fl.wallMat.opacity = mode2d ? 0.8 : (on ? 0.5 : 0.2);
        fl.edgeMat.opacity = on ? 1.0 : 0.4;
        fl.edgeMat.color.setHex((!overview && fl.level === activeFloor) ? 0x9ec2ff : (overview ? 0x7c9cd0 : 0x4f6e9e));
        fl.planMat.opacity = mode2d ? 1 : (on ? 0.9 : 0.4);
        fl.apron.visible = fl.level === activeFloor; // only the floor in focus gets one
      });
      camObjs.forEach(function (o) {
        const vis = !overview && o.cam.floor === activeFloor;
        o.group.visible = vis; // markers only on the selected floor (hidden in overview)
        o.labelObj.visible = vis;
        o.walker.visible = vis;
        o.shadow.visible = vis && !mode2d; // a shadow makes no sense from straight above
      });
    }

    function setFloor(idx) {
      idx = Math.max(0, Math.min(FLOORS - 1, idx));
      if (mode2d) { showPlan(idx); return; } // stay in 2D, just swap the floor
      const wasOverview = overview;
      overview = false;
      if (idx === activeFloor && !wasOverview) return;
      activeFloor = idx;
      applyFloorVisuals();
      applyFloorSpread();
      updateFloorUI();
      // Only shift vertically: keep the current orbit angle / X-Z framing intact.
      const dy = floorCenterY(activeFloor) - controls.target.y;
      const up = new THREE.Vector3(0, dy, 0);
      tween = {
        t: 0, dur: 0.6,
        fromPos: camera.position.clone(), toPos: camera.position.clone().add(up),
        fromTar: controls.target.clone(), toTar: controls.target.clone().add(up),
      };
      controls.autoRotate = false;
    }

    // Floor switcher UI (top -> bottom: F5 .. F1).
    const floorList = document.getElementById('floorList');
    const pips = [];
    for (let f = FLOORS - 1; f >= 0; f--) {
      const p = document.createElement('div');
      p.className = 'fpip'; p.textContent = (f + 1);
      const lvl = f;
      p.addEventListener('click', function () { setFloor(lvl); });
      floorList.appendChild(p); pips.push({ f: f, el: p });
    }
    const showAllBtn = document.getElementById('showAll');
    function updateFloorUI() {
      pips.forEach(function (o) {
        const on = !overview && o.f === activeFloor;
        o.el.classList.toggle('active', on);
        if (on) o.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      });
      showAllBtn.classList.toggle('active', overview);
    }
    document.getElementById('floorUp').addEventListener('click', function () { setFloor(activeFloor + 1); });
    document.getElementById('floorDown').addEventListener('click', function () { setFloor(activeFloor - 1); });

    // "Whole building" overview: collapse the stack and frame all floors.
    function showBuilding() {
      if (mode2d) exit2D();
      overview = true;
      applyFloorVisuals();
      applyFloorSpread();
      updateFloorUI();
      const buildingH = (FLOORS - 1) * FLOOR_SPACING;
      const midY = buildingH / 2 + 1.4;
      const tar = new THREE.Vector3(0, midY, 0);
      // Distance that fits the full height in view (vertical FOV), with margin.
      const dist = buildingH / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.15 + 30;
      const dir = new THREE.Vector3(0.45, 0.5, 0.74).normalize().multiplyScalar(dist);
      tween = {
        t: 0, dur: 0.8,
        fromPos: camera.position.clone(), toPos: tar.clone().add(dir),
        fromTar: controls.target.clone(), toTar: tar,
      };
      controls.autoRotate = false;
    }
    showAllBtn.addEventListener('click', showBuilding);

    // Initial framing on the ground floor.
    applyFloorVisuals();
    applyFloorSpread();
    floors.forEach(function (fl) { fl.group.position.y = fl.targetY; });
    updateFloorUI();
    controls.target.set(0, floorCenterY(activeFloor), 0);
    camera.position.copy(controls.target.clone().add(VIEW_OFFSET));

    // ---- Postprocessing (bloom) ----
    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);
    const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.85, 0.5, 0.85);
    composer.addPass(bloom);

    // ---- Sizing ----
    // World-space footprint the 2D plan has to fit: the plate plus a margin.
    const PLAN_W = SLAB_X * 2 + 4, PLAN_H = SLAB_Z * 2 + 4;
    const planFit = { w: PLAN_W, h: PLAN_H };

    function resize() {
      const w = container.clientWidth || 1;
      const h = container.clientHeight || 1;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      // Contain-fit the floor plan in the viewport.
      const aspect = w / h;
      if (aspect >= PLAN_W / PLAN_H) { planFit.h = PLAN_H; planFit.w = PLAN_H * aspect; }
      else { planFit.w = PLAN_W; planFit.h = PLAN_W / aspect; }
      planCam.left = -planFit.w / 2; planCam.right = planFit.w / 2;
      planCam.top = planFit.h / 2; planCam.bottom = -planFit.h / 2;
      planCam.updateProjectionMatrix();

      renderer.setSize(w, h);
      composer.setSize(w, h);
      labelRenderer.setSize(w, h);
    }
    resize();
    new ResizeObserver(resize).observe(container);

    // ---- 2D floor plan mode ----
    const HINT_3D = '\u043A\u043B\u0438\u043A \u043F\u043E \u044D\u0442\u0430\u0436\u0443 \u2014 \u0432\u044B\u0431\u0440\u0430\u0442\u044C \u00B7 \u0442\u044F\u043D\u0443\u0442\u044C \u0432\u0432\u0435\u0440\u0445/\u0432\u043D\u0438\u0437 \u2014 \u043B\u0438\u0441\u0442\u0430\u0442\u044C \u00B7 \u043A\u043B\u0438\u043A \u0441\u043D\u0430\u0440\u0443\u0436\u0438 \u2014 \u043F\u043B\u0430\u043D 2D \u00B7 \u043A\u043B\u0438\u043A \u043F\u043E \u043A\u0430\u043C\u0435\u0440\u0435 \u2014 \u0432\u0438\u0434\u0435\u043E';
    const HINT_2D = '\u043A\u043E\u043B\u0435\u0441\u043E \u2014 \u0437\u0443\u043C \u00B7 \u043A\u043B\u0438\u043A \u043F\u043E \u043A\u0430\u043C\u0435\u0440\u0435 \u2014 \u0432\u0438\u0434\u0435\u043E \u00B7 \u043A\u043B\u0438\u043A \u043F\u043E \u043F\u043B\u0438\u0442\u0435 \u0441\u043D\u0430\u0440\u0443\u0436\u0438 \u0438\u043B\u0438 Esc \u2014 \u043D\u0430\u0437\u0430\u0434 \u0432 3D';
    const hintEl = document.getElementById('hint');
    const planTitle = document.getElementById('planTitle');
    const PLAN_CAM_H = 60; // orthographic: height only affects clipping and fog
    hintEl.textContent = HINT_3D;

    // Where the 3D view was left, so leaving the plan lands back on it.
    const home = { pos: new THREE.Vector3(), tar: new THREE.Vector3(), floor: 0 };

    // The fullscreen plan needs a sharper texture than the 3D thumbnail-sized one.
    function setPlanDetail(level, hi) {
      const fl = floors[level];
      if (hi) {
        if (!fl.hiTex) fl.hiTex = makePlanTexture(fl.level, 3);
        fl.planMat.map = fl.hiTex;
      } else if (fl.hiTex) {
        fl.planMat.map = fl.baseTex;
        fl.hiTex.dispose();
        fl.hiTex = null;
      }
      fl.planMat.needsUpdate = true;
    }

    // Point the plan camera straight down at a floor.
    function aimPlanCam(y) {
      planCam.position.set(planControls.target.x, y + PLAN_CAM_H, planControls.target.z);
      planCam.lookAt(planControls.target.x, y, planControls.target.z);
    }

    function showPlan(level) {
      level = Math.max(0, Math.min(FLOORS - 1, level));
      if (level !== activeFloor) setPlanDetail(activeFloor, false);
      activeFloor = level;
      setPlanDetail(level, true);
      planTitle.textContent = '\u042D\u0442\u0430\u0436 ' + (level + 1) + ' \u00B7 \u043F\u043B\u0430\u043D';
      applyFloorVisuals();
      applyFloorSpread();
      updateFloorUI();
    }

    function enter2D(level) {
      if (mode2d) { showPlan(level); return; }
      mode2d = true;
      overview = false;
      setHoverFloor(null);
      showPlan(level);

      document.body.classList.add('mode2d');
      container.classList.add('plan2d');
      hintEl.textContent = HINT_2D;
      resize(); // the scene just went fullscreen

      // Remember the 3D framing, then switch straight over: no fly-through.
      home.pos.copy(camera.position);
      home.tar.copy(controls.target);
      home.floor = level;

      tween = null;
      controls.enabled = false;
      controls.autoRotate = false;
      planControls.target.set(0, floors[activeFloor].targetY, 0);
      planCam.zoom = 1;
      planCam.updateProjectionMatrix();
      aimPlanCam(floors[activeFloor].targetY);
      planControls.enabled = true;
      activeCam = planCam;
      renderPass.camera = planCam;
    }

    function exit2D() {
      if (!mode2d) return;
      mode2d = false;
      planControls.enabled = false;
      setHoverFloor(null); // the chip's wording depends on the mode
      setPlanDetail(activeFloor, false);
      document.body.classList.remove('mode2d');
      container.classList.remove('plan2d');
      hintEl.textContent = HINT_3D;
      resize(); // back to the smaller viewport

      // Straight back to the framing we came from, lifted if the floor changed.
      const dy = floorCenterY(activeFloor) - floorCenterY(home.floor);
      tween = null;
      activeCam = camera;
      renderPass.camera = camera;
      camera.position.set(home.pos.x, home.pos.y + dy, home.pos.z);
      controls.target.set(home.tar.x, home.tar.y + dy, home.tar.z);
      controls.enabled = true;

      applyFloorVisuals();
      applyFloorSpread();
      updateFloorUI();
    }

    document.getElementById('exit2d').addEventListener('click', exit2D);
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && mode2d) exit2D();
    });

    // ---- Picking / interaction ----
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    let downXY = null;

    function setNdc(ev) {
      const r = renderer.domElement.getBoundingClientRect();
      ndc.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
      ndc.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
      raycaster.setFromCamera(ndc, activeCam);
    }

    function pick(ev) {
      setNdc(ev);
      const hits = raycaster.intersectObjects(pickables, true);
      for (const h of hits) {
        let o = h.object;
        while (o && !o.userData.cam) o = o.parent;
        if (o && !overview && o.userData.cam.floor === activeFloor) return o.userData.cam;
      }
      return null;
    }

    // Nearest floor plate under the pointer: { level, kind, x, z } or null.
    function pickPlate(ev) {
      setNdc(ev);
      const hits = raycaster.intersectObjects(floorPlates, false);
      for (const h of hits) {
        // Hidden plates still register hits, and in plan view they sit between
        // the camera and the floor being looked at.
        if (!h.object.visible || !h.object.parent.visible) continue;
        return {
          level: h.object.userData.floorLevel, kind: h.object.userData.plate,
          x: h.point.x, z: h.point.z,
        };
      }
      return null;
    }

    // Plates worth a hover chip: the apron always, a slab only when clicking it
    // would actually change the selection.
    function hoverPlate(ev) {
      const p = pickPlate(ev);
      if (!p) return null;
      if (p.kind === 'slab' && (mode2d || p.level === activeFloor)) return null;
      return p;
    }

    // Hint chip shown while the apron is hovered. Deliberately click-through:
    // the click is handled by the canvas, so the chip can sit under the cursor.
    const badgeEl = document.createElement('div');
    badgeEl.className = 'floor-badge';
    badgeEl.innerHTML =
      '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 10h18M13 10v11"/></svg>' +
      '<span></span>';
    const badgeText = badgeEl.querySelector('span');
    const badgeObj = new CSS2DObject(badgeEl);
    badgeObj.visible = false;
    scene.add(badgeObj);

    let hoverFloor = -1, hoverKind = '';
    const hoverAt = new THREE.Vector3();
    function setHoverFloor(spot) {
      const level = spot ? spot.level : -1;
      const kind = spot ? spot.kind : '';
      if (spot) hoverAt.set(spot.x, 0, spot.z);
      if (level === hoverFloor && kind === hoverKind) return;
      if (hoverFloor >= 0) {
        floors[hoverFloor].apronMat.color.setHex(SLAB_COLOR);
        floors[hoverFloor].slabMat.color.setHex(SLAB_COLOR);
      }
      hoverFloor = level;
      hoverKind = kind;
      badgeObj.visible = level >= 0;
      if (level < 0) return;
      if (kind === 'apron') {
        floors[level].apronMat.color.setHex(SLAB_HOVER);
        badgeText.textContent = mode2d
          ? '\u041A\u043B\u0438\u043A \u2014 \u043D\u0430\u0437\u0430\u0434 \u0432 3D'
          : '\u042D\u0442\u0430\u0436 ' + (level + 1) + ' \u00B7 \u043A\u043B\u0438\u043A \u2014 \u043F\u043B\u0430\u043D 2D';
      } else {
        floors[level].slabMat.color.setHex(SLAB_HOVER);
        badgeText.textContent = '\u042D\u0442\u0430\u0436 ' + (level + 1) + ' \u00B7 \u043A\u043B\u0438\u043A \u2014 \u0432\u044B\u0431\u0440\u0430\u0442\u044C';
      }
    }

    // Hauling a floor up or down walks the selection through the stack, as if
    // the building were being pulled past a fixed eye level.
    const DRAG_PER_FLOOR = 46; // px of travel per floor
    let haul = null;

    function endHaul() {
      const wasHauling = !!(haul && haul.on);
      if (wasHauling) controls.enableRotate = true;
      haul = null;
      return wasHauling;
    }

    const dom = renderer.domElement;
    dom.addEventListener('pointerdown', function (e) {
      downXY = [e.clientX, e.clientY];
      controls.autoRotate = false; // stop the intro spin on first interaction
      person.kick();
      if (!mode2d && pickPlate(e)) haul = { x: e.clientX, y: e.clientY, from: activeFloor, on: false };
    });
    dom.addEventListener('pointerup', function (e) {
      const hauled = endHaul();
      if (!downXY) return;
      const moved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]);
      downXY = null;
      if (hauled || moved > 6) return; // it was a drag, not a click
      const cam = pick(e);
      if (cam) { window.openCard(cam); return; }
      const p = pickPlate(e);
      if (!p) return;
      // The apron outside the walls toggles the plan: in, then back out.
      if (p.kind === 'apron') { if (mode2d) exit2D(); else enter2D(p.level); }
      else if (!mode2d) setFloor(p.level);
    });
    dom.addEventListener('pointermove', function (e) {
      if (haul) {
        const dx = e.clientX - haul.x, dy = e.clientY - haul.y;
        // A sideways start means the user wants to orbit after all.
        if (!haul.on && Math.abs(dx) > 7) haul = null;
        else if (!haul.on && Math.abs(dy) > 7) {
          haul.on = true;
          controls.enableRotate = false;
          setHoverFloor(null);
          dom.style.cursor = 'ns-resize';
        }
        if (haul && haul.on) {
          // Pulling the stack down brings the floors above it into focus.
          setFloor(haul.from + Math.round(dy / DRAG_PER_FLOOR));
          return;
        }
      }
      const cam = pick(e);
      if (downXY) { dom.style.cursor = 'grabbing'; return; } // don't fight the orbit drag
      const spot = cam ? null : hoverPlate(e);
      setHoverFloor(spot);
      dom.style.cursor = (cam || spot) ? 'pointer' : 'grab';
    });
    dom.addEventListener('pointercancel', endHaul);
    dom.addEventListener('pointerleave', function () {
      endHaul();
      downXY = null;
      setHoverFloor(null);
    });

    // ---- Fly-to focus (called from openCard) ----
    let tween = null;
    const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

    window.focusCamera = function (cam) {
      if (mode2d) return; // the plan view stays put
      if (!overview && cam.floor !== activeFloor) { activeFloor = cam.floor; applyFloorVisuals(); applyFloorSpread(); updateFloorUI(); }
      const pos = cam._pos, dir = cam._dir;
      const flat = dir.clone().setY(0);
      if (flat.lengthSq() < 1e-4) flat.set(0, 0, 1);
      flat.normalize();
      const dest = pos.clone().add(flat.multiplyScalar(-9)).add(new THREE.Vector3(0, 5, 0));
      tween = {
        t: 0, dur: 0.7,
        fromPos: camera.position.clone(), toPos: dest,
        fromTar: controls.target.clone(), toTar: pos.clone(),
      };
      controls.autoRotate = false;
    };

    // ---- Animation loop ----
    const clock = new THREE.Clock();
    let introT = 0;
    const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      // Entrance: cameras pop in simultaneously.
      if (introT < 1) {
        introT = Math.min(1, introT + dt / 0.6);
        const s = easeOutBack(introT);
        camObjs.forEach(o => o.group.scale.setScalar(Math.max(0.001, s)));
      }

      // Exploded-view spread: ease each floor toward its target height.
      const k = 1 - Math.pow(0.001, dt); // frame-rate independent smoothing
      floors.forEach(function (fl) {
        fl.group.position.y += (fl.targetY - fl.group.position.y) * k;
      });

      // Fly-to tween.
      if (tween) {
        tween.t = Math.min(1, tween.t + dt / tween.dur);
        const e = easeInOut(tween.t);
        camera.position.lerpVectors(tween.fromPos, tween.toPos, e);
        controls.target.lerpVectors(tween.fromTar, tween.toTar, e);
        if (tween.t >= 1) {
          const done = tween.onDone;
          tween = null;
          if (done) done();
        }
      }

      // Keep the plan camera over the (still settling) active floor.
      if (mode2d && activeCam === planCam) {
        planControls.target.y = floors[activeFloor].group.position.y;
        aimPlanCam(planControls.target.y);
      }

      // The hover chip floats just above the spot on the plate being pointed at.
      if (badgeObj.visible && hoverFloor >= 0) {
        badgeObj.position.set(hoverAt.x, floors[hoverFloor].group.position.y + 0.9, hoverAt.z);
      }

      if (person.live) {
        // Re-measure the clip often enough to keep the figure pinned in place.
        person.probeAcc += dt;
        if (person.probeAcc > 0.12) { person.probeAcc = 0; person.measure(); }
        const ease = Math.min(1, dt * 8);
        fit.w += (fitTarget.w - fit.w) * ease;
        fit.h += (fitTarget.h - fit.h) * ease;
        fit.cx += (fitTarget.cx - fit.cx) * ease;
        fit.cy += (fitTarget.cy - fit.cy) * ease;
      } else {
        sprites.forEach(function (s) { s.step(t, dt); });
      }
      const eyeX = activeCam.position.x, eyeZ = activeCam.position.z;

      // Walk the people and pulse the selected camera.
      camObjs.forEach((o, i) => {
        if (!o.group.visible) return; // skip cameras on hidden floors
        const active = window.selectedCam === o.cam;
        const pulse = 0.7 + 0.35 * Math.sin(t * 3 + i);
        o.lens.material.emissiveIntensity = (active ? 3.0 : 1.1) * pulse;
        o.lens.material.emissive.setHex(active ? 0x2fe0ff : 0xf0883e);
        o.label.classList.toggle('active', active);

        // Back and forth along the path, in metres per second.
        const trip = (t * o.speed + o.phase) / Math.max(0.5, o.span);
        const leg = Math.floor(trip) % 2;
        const s = trip - Math.floor(trip);
        const walk = leg === 0 ? s : 1 - s;
        const px = o.from.x + (o.to.x - o.from.x) * walk;
        const pz = o.from.z + (o.to.z - o.from.z) * walk;

        const p = o.walker;
        if (mode2d) {
          // Straight down: lay the image on the floor so it stays visible.
          p.position.set(px, 0.12, pz);
          p.rotation.set(-Math.PI / 2, 0, 0);
        } else {
          // Upright, turning about the feet to keep facing the viewer.
          p.position.set(px, 0, pz);
          p.rotation.set(0, Math.atan2(eyeX - px, eyeZ - pz), 0);
        }
        o.quad.position.set(fit.cx, fit.cy, 0);
        o.quad.scale.set(fit.w, fit.h, 1);

        // Mirror when the walk reads right-to-left on screen.
        const travel = (leg === 0 ? 1 : -1);
        const rx = Math.cos(p.rotation.y), rz = -Math.sin(p.rotation.y);
        const toward = travel * ((o.to.x - o.from.x) * rx + (o.to.z - o.from.z) * rz);
        p.scale.x = (!person.mirror || toward >= 0) ? 1 : -1;

        o.shadow.position.x = px;
        o.shadow.position.z = pz;
      });

      if (mode2d) { if (planControls.enabled) planControls.update(); }
      else controls.update();
      composer.render();
      labelRenderer.render(scene, activeCam);
    }
    animate();
  </script>
</body>
</html>
